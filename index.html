<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DTRV">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<title>DTRV</title>
</head>
<body>
<div class="app" id="app">
    <div class="glow"><i></i><i></i><i></i></div>
    <div class="toast" id="toast"></div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="scrim" id="pkScrim"></div>
    <div class="sheet pkr" id="picker"></div>

    <!-- 1 · Record -->
    <div class="scr" id="p-record">
      <button class="secret" id="toAdmin" aria-label="·">✦</button>
      <div class="rclock" data-st><div class="date" id="hDate"></div><div class="clock" id="hTime"></div></div>
      <div class="welcome" id="welcome" hidden>
        <div class="wic" id="wIc" data-st></div>
        <b data-st></b>
        <p data-st></p>
        <input id="keyIn" data-st type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste sync key or link" hidden>
        <button class="bigbtn" id="startSetup" data-st>Set up</button>
        <button class="wlink" id="wAlt" data-st hidden></button>
      </div>
      <div class="rail" id="toggles">
        <button class="tg g1" data-st data-s="am_in"><span data-ic="sun"></span><b>AM<br>IN</b><span class="st">Arrive</span></button>
        <button class="tg g2" data-st data-s="am_out"><span data-ic="fork"></span><b>AM<br>OUT</b><span class="st">Lunch</span></button>
        <button class="tg g3" data-st data-s="pm_in"><span data-ic="cup"></span><b>PM<br>IN</b><span class="st">Back</span></button>
        <button class="tg g4" data-st data-s="pm_out"><span data-ic="home"></span><b>PM<br>OUT</b><span class="st">Home</span></button>
      </div>
      <div class="chips" id="chips">
        <button class="rbtn" id="remarkBtn" data-st>
          <i class="ci"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></i>
          <span><b>Remark</b><small>Leave · Day-off · Holiday · Others</small></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="dots" id="empno" data-st><div style="--n:0"></div><div style="--n:1"></div><div style="--n:2"></div></div>
      <div class="keys" id="keys"></div>
    </div>

    <!-- 2 · My DTR -->
    <div class="scr hide" id="p-my">
      <div class="mtop"><a id="myBack">‹ Back</a><div class="mnav"><button id="mPrev">‹</button><span id="mLabel"></span><button id="mNext">›</button></div></div>
      <div class="mname" data-st><div class="sub" id="myNo"></div><div class="nm" id="myName"></div></div>
      <div id="myStats" data-st></div>
      <div class="cal" id="myDays"></div>
      <div class="legend"><span><i style="background:var(--rok)"></i>On time</span><span><i style="background:var(--rlate)"></i>Late</span><span><i style="background:var(--rrem)"></i>Remark</span><span><i style="background:var(--rhol)"></i>Holiday</span><span><i style="background:var(--rwarn)"></i>Incomplete</span></div>
      <div id="myDetail"></div>
      <div class="mspace"></div>
      <div class="mbtn" data-st><button id="myRemark">+ Remark</button><button class="p" id="myPrint">Print DTR</button></div>
    </div>

    <!-- 3 · Print (employee) -->
    <div class="scr hide" id="p-print">
      <div class="mtop"><a id="printBack">‹ Back</a><span style="font:600 13px 'Space Grotesk'">Print DTR</span></div>
      <div id="printBody" class="fill" style="flex:1;min-height:0;margin-top:10px"></div>
    </div>

    <!-- 4 · Admin gate -->
    <div class="scr gate hide" id="p-gate">
      <button class="back" id="gateBack">‹ Cancel</button>
      <div class="lock" id="gateLock"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <h2 id="gateTitle">Admin</h2><p id="gateSub">Enter your 6-digit PIN</p>
      <div class="dots six" id="gdots" style="margin-top:22px"><div style="--n:0"></div><div style="--n:1"></div><div style="--n:2"></div><div style="--n:3"></div><div style="--n:4"></div><div style="--n:5"></div></div>
      <div class="keys" id="gkeys"></div>
    </div>

    <!-- 5 · Admin -->
    <div class="scr hide" id="p-admin">
      <div class="ahead"><h2 id="aTitle">Overview</h2><button class="lockbtn" id="aLock" aria-label="Lock admin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
      <div class="abody" id="aBody"></div>
      <div class="atabs" id="aTabs"><i class="ind"></i></div>
    </div>
</div>
<div id="printRoot"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
